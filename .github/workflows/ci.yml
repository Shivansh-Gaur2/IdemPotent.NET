name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-pack:
    name: Build, test, and validate packages
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: IdemShield!Test2026
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'IdemShield!Test2026' -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore dependencies
        run: dotnet restore IdemShield.sln --locked-mode

      - name: Build
        run: dotnet build IdemShield.sln --configuration Release --no-restore

      - name: Verify formatting
        run: dotnet format IdemShield.sln --verify-no-changes --no-restore

      - name: Test
        run: dotnet test IdemShield.sln --configuration Release --no-build --no-restore --logger trx --results-directory artifacts/test-results
        env:
          IDEMSHIELD_REDIS_TEST_CONNECTION: localhost:6379
          IDEMSHIELD_SQL_TEST_CONNECTION: Server=localhost,1433;Database=tempdb;User Id=sa;Password=IdemShield!Test2026;Encrypt=True;TrustServerCertificate=True

      - name: Audit NuGet dependencies
        shell: pwsh
        run: ./eng/audit-packages.ps1

      - name: Pack NuGet packages
        run: dotnet pack IdemShield.sln --configuration Release --no-build --no-restore --output artifacts/packages

      - name: Validate packages and clean-consumer installation
        shell: pwsh
        run: ./eng/verify-packages.ps1 -PackageDirectory artifacts/packages -Version 0.1.0

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/test-results/**/*.trx
          if-no-files-found: warn
          retention-days: 14

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/packages/*.*nupkg
          if-no-files-found: error
          retention-days: 30
